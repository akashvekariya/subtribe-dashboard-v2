name: CI/CD Pipeline

# Trigger on all pull requests and pushes to any branch
# Deployment is controlled by job-level conditions (only push- commits deploy to dev)
on:
  push: # All pushes trigger lint-test, only "push-" commits deploy to dev
  workflow_dispatch: # Allow manual triggering

# Required for auto-versioning (not used in dev, but keeps pattern consistent)
permissions:
  contents: write

env:
  # GCP Configuration
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-south1 # Mumbai region
  SERVICE_NAME: subtribe-frontend-dev
  IMAGE_NAME: subtribe-frontend

jobs:
  # ============================================================================
  # Job 1: Lint & Test (runs on all pushes/PRs)
  # ============================================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js with pnpm
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 2.5: Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.23.0
          run_install: false

      # Step 3: Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 4: Run ESLint
      - name: Lint with ESLint
        run: |
          echo "🔍 Running ESLint..."
          pnpm run lint
        continue-on-error: false

      # Step 5: Auto-format code (safety check, should already be formatted by pre-commit)
      - name: Auto-format code with Prettier
        run: |
          echo "✨ Auto-formatting code..."
          pnpm run format
        continue-on-error: false

      # Step 6: Type check with TypeScript
      - name: Type check with TypeScript
        run: |
          echo "🔎 Running TypeScript type checker..."
          pnpm run typecheck
        continue-on-error: false

      # Step 7: Summary
      - name: Summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "   - Code linting ✓"
          echo "   - Code formatting ✓"
          echo "   - Type checking ✓"

  # ============================================================================
  # Job 2: Deploy to Development (runs ONLY on "push-" commits, after lint-test succeeds)
  # ============================================================================
  deploy-dev:
    name: Build & Deploy to Cloud Run (Development)
    runs-on: ubuntu-latest
    needs: lint-test # Wait for lint-test to pass
    # Use GitHub Environment for environment-specific secrets/variables
    environment: Development
    # Deploy to dev if commit message starts with "push-"
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'push-')

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 3: Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 4: Configure Docker to use gcloud as credential helper
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # Step 5: Build Docker image with build args for Next.js env vars
      - name: Build Docker image
        run: |
          echo "🔨 Building Docker image for Development..."
          echo "📝 Commit SHA: ${{ github.sha }}"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }} \
            --build-arg NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest \
            .

      # Step 6: Push Docker image to Artifact Registry
      - name: Push Docker image
        run: |
          echo "📦 Pushing Docker image to Artifact Registry..."
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest

      # Step 7: Deploy to Cloud Run (Development)
      - name: Deploy to Cloud Run (Development)
        run: |
          echo "🚀 Deploying to Cloud Run (Development)..."
          echo "🎯 Service: ${{ env.SERVICE_NAME }}"
          echo "📦 Image: ${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=Development,NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }},NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }},NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60s \
            --max-instances=1 \
            --min-instances=0

          echo "🔀 Routing 100% traffic to latest revision..."
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      # Step 8: Get service URL
      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "✅ Deployment successful!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "🎯 Service: ${{ env.SERVICE_NAME }}"
          echo "🌍 Environment: Development"
          echo "📦 Version: ${{ github.sha }}"

      # Step 9: Run smoke test
      - name: Smoke test
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "🔍 Running smoke test..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL)
          # Accept 200 (OK) or 307 (redirect to /dashboard or /sign-in)
          if [ $HTTP_CODE -eq 200 ] || [ $HTTP_CODE -eq 307 ]; then
            echo "✅ Smoke test passed (HTTP $HTTP_CODE)"
          else
            echo "❌ Smoke test failed (HTTP $HTTP_CODE)"
            exit 1
          fi
